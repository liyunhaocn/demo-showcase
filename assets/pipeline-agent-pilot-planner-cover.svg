<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline Agent Pilot Planner cover</title>
  <desc id="desc">Enterprise dashboard cover for a controlled CRM agent pilot with readiness, ROI, and gate cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f3f7f5"/>
      <stop offset="100%" stop-color="#e5efec"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fbfa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#175f4f"/>
      <stop offset="100%" stop-color="#0d463b"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <rect x="56" y="56" width="238" height="64" rx="18" fill="#0f1720"/>
  <text x="78" y="95" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Pipeline Agent Pilot Planner</text>

  <text x="60" y="190" fill="#10231e" font-family="Inter, Arial, sans-serif" font-size="60" font-weight="800">Controlled CRM agent pilots</text>
  <text x="60" y="246" fill="#58706a" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="500">Scope a sales agent, score readiness, and export the rollout gates before anything touches production CRM data.</text>

  <rect x="1154" y="58" width="390" height="102" rx="18" fill="url(#card)" stroke="#d3e0db"/>
  <text x="1184" y="101" fill="#0d4b3e" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Deterministic static demo</text>
  <text x="1184" y="135" fill="#566762" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">No live CRM, AI, model, or customer-data calls.</text>

  <rect x="58" y="316" width="1490" height="520" rx="20" fill="url(#card)" stroke="#d6e1dd"/>

  <rect x="84" y="344" width="420" height="466" rx="18" fill="#ffffff" stroke="#d8e2df"/>
  <text x="104" y="382" fill="#0d4b3e" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Pilot inputs</text>
  <text x="104" y="416" fill="#1b2327" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Revenue team snapshot</text>

  <rect x="104" y="452" width="380" height="54" rx="12" fill="#eff6f4" stroke="#cfded9"/>
  <rect x="104" y="520" width="380" height="54" rx="12" fill="#eff6f4" stroke="#cfded9"/>
  <rect x="104" y="588" width="380" height="54" rx="12" fill="#eff6f4" stroke="#cfded9"/>
  <rect x="104" y="656" width="380" height="54" rx="12" fill="#eff6f4" stroke="#cfded9"/>
  <rect x="104" y="724" width="380" height="54" rx="12" fill="#175f4f" stroke="#175f4f"/>
  <text x="130" y="488" fill="#5a6d67" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Org / CRM / segment / blockers</text>
  <text x="130" y="556" fill="#5a6d67" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Pipeline value / win rate / cycle days</text>
  <text x="130" y="624" fill="#5a6d67" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Data quality / owner coverage / posture</text>
  <text x="130" y="692" fill="#5a6d67" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Scope / objective / sandbox mode</text>
  <text x="150" y="759" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Generate pilot brief</text>

  <rect x="534" y="344" width="1002" height="466" rx="18" fill="#ffffff" stroke="#d8e2df"/>
  <text x="556" y="382" fill="#0d4b3e" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Pilot brief</text>
  <text x="556" y="416" fill="#1b2327" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Readiness, ROI, gates, and rollout path</text>

  <rect x="556" y="452" width="200" height="118" rx="16" fill="#eff7f5" stroke="#cde2dc"/>
  <rect x="774" y="452" width="200" height="118" rx="16" fill="#eff7f5" stroke="#cde2dc"/>
  <rect x="992" y="452" width="200" height="118" rx="16" fill="#fff5e8" stroke="#ead6b8"/>
  <rect x="1210" y="452" width="298" height="118" rx="16" fill="#eff7f5" stroke="#cde2dc"/>

  <text x="580" y="492" fill="#1b2327" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="800">83</text>
  <text x="580" y="528" fill="#5a6d67" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Readiness</text>
  <text x="798" y="492" fill="#1b2327" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="800">87</text>
  <text x="798" y="528" fill="#5a6d67" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">ROI index</text>
  <text x="1016" y="492" fill="#1b2327" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="800">Medium</text>
  <text x="1016" y="528" fill="#5a6d67" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Risk level</text>
  <text x="1234" y="492" fill="#1b2327" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="800">2-week</text>
  <text x="1234" y="528" fill="#5a6d67" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Pilot path</text>

  <rect x="556" y="596" width="938" height="182" rx="16" fill="#f9fbfa" stroke="#d8e2df"/>
  <rect x="584" y="622" width="282" height="130" rx="14" fill="#ffffff" stroke="#d8e2df"/>
  <rect x="896" y="622" width="282" height="130" rx="14" fill="#ffffff" stroke="#d8e2df"/>
  <rect x="1208" y="622" width="258" height="130" rx="14" fill="#ffffff" stroke="#d8e2df"/>
  <text x="610" y="672" fill="#0d4b3e" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Gate 01</text>
  <text x="610" y="700" fill="#5a6d67" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Sandbox-only suggestions</text>
  <text x="920" y="672" fill="#0d4b3e" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Gate 02</text>
  <text x="920" y="700" fill="#5a6d67" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Manager approval before CRM writes</text>
  <text x="1232" y="672" fill="#0d4b3e" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Gate 03</text>
  <text x="1232" y="700" fill="#5a6d67" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Track accepted vs rejected suggestions</text>
</svg>
